<!DOCTYPE html>
<html>

<head>
    <title>Live Camera Directory</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        button {
            background: #2ea043;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: white;
            width: calc(100% - 24px);
            margin-bottom: 15px;
        }

        .stream-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .stream-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
        }

        .hidden {
            display: none !important;
        }

        .btn-secondary {
            background: #30363d;
            margin-bottom: 15px;
        }

	/* Video and Overlay Styling */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden; /* Keeps overlay inside rounded corners */
            background: #000;
        }
        
        video { 
            width: 100%; 
            display: block; /* Removes bottom gap */
        }
        
        /* Chat Logs Overlay */
        .chat-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 60%; /* Only cover the bottom 60% of the video */
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.85));
            padding: 20px 10px 10px 10px;
            box-sizing: border-box;
            overflow-y: auto;
            text-align: left;
            font-size: 14px;
            
            /* Push messages to the bottom */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .chat-overlay p { 
            margin: 4px 0; 
            text-shadow: 1px 1px 2px rgba(0,0,0,1); /* Ensures text is readable over bright video */
            word-wrap: break-word;
        }
        
        .chat-overlay .author { 
            font-weight: bold; 
            color: #58a6ff; 
        }

        /* Separate Input Area */
        .chat-input-area { 
            display: flex; 
            margin-top: 15px; 
            gap: 10px; 
        }
        
        .chat-input-area input { 
            margin: 0; 
            flex-grow: 1; 
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Live Webcams</h2>

        <!-- View 1: Name Input -->
        <div id="nameView">
            <h3>Who is watching?</h3>
            <input type="text" id="viewerNameInput" placeholder="Enter your name">
            <button id="saveNameBtn" style="width: 100%;">Continue</button>
        </div>

        <!-- View 2: Channel List -->
        <div id="selectionView" class="hidden">
            <p id="noStreamsMsg">No active broadcasts. Start a camera on another device to see it here.</p>
            <div id="streamList" class="stream-list"></div>
        </div>

        <!-- View 3: Video Player & Chat -->
        <div id="playerView" class="hidden">
            <button id="backBtn" class="btn-secondary">← Back to Channels</button>
            <h3 id="currentStreamTitle">Stream Feed</h3>

	    <!-- Wrapper holds both video and the chat overlay -->
            <div class="video-wrapper">
                <video id="remoteVideo" playsinline autoplay muted></video>
                <div id="chatMessages" class="chat-overlay"></div>
            </div>
            
            <button id="unmuteBtn" class="btn-secondary" style="margin-top:10px;">Unmute Audio</button>

            <!-- Chat input sits below the video -->
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Type a comment...">
                <button id="sendChatBtn">Send</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io.connect(window.location.origin);

        let peerConnection = null;
        let activeBroadcasterId = null;
        let viewerName = "Anonymous";

        const nameView = document.getElementById('nameView');
        const selectionView = document.getElementById('selectionView');
        const playerView = document.getElementById('playerView');
        const streamList = document.getElementById('streamList');
        const remoteVideo = document.getElementById('remoteVideo');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const currentStreamTitle = document.getElementById('currentStreamTitle');

        const config = {
            iceServers: [
                {urls: "stun:stun.l.google.com:19302"},
                {urls: "stun:stun1.l.google.com:19302"},
                {urls: "stun:stun2.l.google.com:19302"}
            ]
        };

        // --- STEP 1: Save Name ---
        document.getElementById('saveNameBtn').addEventListener('click', () => {
            const inputName = document.getElementById('viewerNameInput').value.trim();
            if (inputName) viewerName = inputName;

            nameView.classList.add('hidden');
            selectionView.classList.remove('hidden');
            socket.emit("getBroadcasters");
        });

        // --- STEP 2: Stream Selection ---
        socket.on("broadcasterList", list => {
            streamList.innerHTML = "";
            if (list.length === 0) {
                document.getElementById('noStreamsMsg').classList.remove('hidden');
            } else {
                document.getElementById('noStreamsMsg').classList.add('hidden');
                list.forEach(stream => {
                    const card = document.createElement('div');
                    card.className = "stream-card";
                    card.innerHTML = `
                        <span style="font-size: 18px; font-weight: bold;">🔴 ${stream.name}</span>
                        <button onclick="watchStream('${stream.id}', '${stream.name}')">Watch Stream</button>
                    `;
                    streamList.appendChild(card);
                });
            }
        });

        function watchStream(broadcasterId, streamName) {
            activeBroadcasterId = broadcasterId;
            currentStreamTitle.innerText = streamName;
            chatMessages.innerHTML = "";

            selectionView.classList.add('hidden');
            playerView.classList.remove('hidden');

            socket.emit("watcher", broadcasterId);
        }

        // --- STEP 3: Chat Logic ---
        document.getElementById('sendChatBtn').addEventListener('click', sendChat);
        chatInput.addEventListener('keypress', (e) => {if (e.key === 'Enter') sendChat();});

        function sendChat() {
            const text = chatInput.value.trim();
            if (text && activeBroadcasterId) {
                socket.emit("chatMessage", {broadcasterId: activeBroadcasterId, name: viewerName, text: text});
                chatInput.value = "";
            }
        }

        socket.on("chatMessage", data => {
            if (data.broadcasterId === activeBroadcasterId) {
                const p = document.createElement('p');
                p.innerHTML = `<span class="author">${data.name}:</span> ${data.text}`;
                chatMessages.appendChild(p);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        });

        // --- STEP 4: WebRTC & Cleanup ---
        document.getElementById('backBtn').addEventListener('click', () => {
            if (peerConnection) peerConnection.close();
            peerConnection = null;
            remoteVideo.srcObject = null;

            socket.emit('leaveStream', activeBroadcasterId);
            activeBroadcasterId = null;

            playerView.classList.add('hidden');
            selectionView.classList.remove('hidden');
        });

        document.getElementById('unmuteBtn').addEventListener('click', (e) => {
            remoteVideo.muted = !remoteVideo.muted;
            e.target.innerText = remoteVideo.muted ? "Unmute Audio" : "Mute Audio";
        });

        socket.on("offer", (id, description) => {
            if (id !== activeBroadcasterId) return;
            if (peerConnection) peerConnection.close();

            peerConnection = new RTCPeerConnection(config);
            peerConnection.ontrack = event => {
                remoteVideo.srcObject = event.streams[0];
                remoteVideo.play().catch(e => console.error("Autoplay prevented:", e));
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) socket.emit("candidate", id, event.candidate);
            };

            peerConnection.setRemoteDescription(description)
                .then(() => peerConnection.createAnswer())
                .then(sdp => peerConnection.setLocalDescription(sdp))
                .then(() => socket.emit("answer", id, peerConnection.localDescription))
                .catch(err => console.error("WebRTC Offer Error:", err)); // Added error catch
        });

        socket.on("candidate", (id, candidate) => {
            if (id === activeBroadcasterId && peerConnection) {
                peerConnection.addIceCandidate(new RTCIceCandidate(candidate))
                    .catch(e => console.error("ICE Candidate Error:", e)); // Added error catch
            }
        });

        socket.on("disconnectPeer", id => {
            if (id === activeBroadcasterId) document.getElementById('backBtn').click();
        });
    </script>
</body>

</html>
