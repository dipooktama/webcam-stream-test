<!DOCTYPE html>
<html>
<head>
    <title>Webcam Viewer</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; }
        video { width: 100%; max-width: 800px; border-radius: 8px; background: #000; }
    </style>
</head>
<body>
    <h2>Remote Viewer: Live Feed</h2>
    <video playsinline autoplay></video>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let peerConnection = null;
        const video = document.querySelector('video');
        const socket = io.connect(window.location.origin);
        
        const config = {
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        };

        socket.on("connect", () => {
            socket.emit("watcher");
        });

        socket.on("broadcaster", () => {
            socket.emit("watcher");
        });

        socket.on("offer", (id, description) => {
            if (peerConnection) {
                peerConnection.close();
            }

            peerConnection = new RTCPeerConnection(config);
            
            peerConnection.ontrack = event => {
                video.srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit("candidate", id, event.candidate);
                }
            };

            peerConnection
                .setRemoteDescription(description)
                .then(() => peerConnection.createAnswer())
                .then(sdp => peerConnection.setLocalDescription(sdp))
                .then(() => socket.emit("answer", id, peerConnection.localDescription))
                .catch(err => console.error("Error handling offer:", err));
        });

        socket.on("candidate", (id, candidate) => {
            if (peerConnection) {
                peerConnection
                    .addIceCandidate(new RTCIceCandidate(candidate))
                    .catch(e => console.error("Error adding ice candidate:", e));
            }
        });

        socket.on("disconnectPeer", () => {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            video.srcObject = null;
        });

        window.onunload = window.onbeforeunload = () => {
            socket.close();
        };
    </script>
</body>
</html>
